name: Native installer from verified Windows package
on:
  push:
    branches: [build/windows-installer-20261029]
    paths:
      - .github/workflows/windows-installer.yml
      - scripts/fetch-nsis.mjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: flowhub-native-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Recover exact package with passing native software gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = '0faa81f42809d71e5160700acc732e35613acb79'
          $sourceTree = '0fb9053a2705a9439dff2dea59ca2220f70e2d71338eab47756b2fd5f7ac4d90'
          $zipHash = '7a3f732781f7d42a88fbd0f46430e2a898d5f3bcf2a59dc7b5f5c7097d55fef1'
          $original = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/40907990313" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $original.head_sha -ne $sourceCommit) { throw 'Unexpected source run' }
          $job = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/123567915300" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $job.run_id -ne 40907990313 -or $job.name -ne 'poc (windows-latest)') { throw 'Unexpected native job' }
          foreach ($gate in @('Run npm run check', 'Run npm test', 'Run npm audit --omit=dev --audit-level=moderate', 'Run npm run package:windows', 'Run npm run test:package', 'Run npm run verify:release')) {
            $matched = @($job.steps | Where-Object { $_.name -eq $gate -and $_.conclusion -eq 'success' })
            if ($matched.Count -ne 1) { throw "Source gate did not pass: $gate" }
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $download = Join-Path $env:RUNNER_TEMP 'fh-download'
          gh run download 40907990313 --repo "$env:GITHUB_REPOSITORY" --name flowhub-rc-Windows --dir "$download"
          if ($LASTEXITCODE -ne 0) { throw 'Verified package artifact download failed' }
          $archive = Join-Path $download 'flowhub-1.0.0-rc.1-win32-x64-2026-10-29T16-08-29-994Z.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $zipHash) { throw 'Source ZIP hash mismatch' }
          $extracted = Join-Path $env:RUNNER_TEMP 'fh-extract'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          $folders = @(Get-ChildItem -LiteralPath $extracted -Directory)
          if ($folders.Count -ne 1) { throw 'Unexpected package layout' }
          $bundle = Join-Path $env:RUNNER_TEMP 'fh-bundle'
          Move-Item -LiteralPath $folders[0].FullName -Destination $bundle
          $build = Get-Content -LiteralPath (Join-Path $bundle 'build-info.json') -Raw | ConvertFrom-Json
          if ($build.gitSha -ne $sourceCommit -or $build.sourceTreeSha256 -ne $sourceTree -or $build.os -ne 'win32' -or $build.arch -ne 'x64') { throw 'Source identity mismatch' }
          $runtime = Join-Path $bundle 'runtime/node.exe'
          $env:FLOWHUB_VERIFIED_BUNDLE = $bundle
          Push-Location -LiteralPath (Join-Path $bundle 'source')
          try {
            & $runtime --input-type=module -e "import {verifyBundle} from './scripts/verify-release.mjs'; await verifyBundle(process.env.FLOWHUB_VERIFIED_BUNDLE);"
            if ($LASTEXITCODE -ne 0) { throw 'Source manifest verification failed' }
          } finally { Pop-Location }
          $sourceCopy = Join-Path $env:RUNNER_TEMP 'fh-source'
          New-Item -ItemType Directory -Path $sourceCopy | Out-Null
          Get-ChildItem -LiteralPath (Join-Path $bundle 'source') -Force | Copy-Item -Destination $sourceCopy -Recurse -Force
          Copy-Item -LiteralPath $archive -Destination artifacts
          Copy-Item -LiteralPath "$archive.sha256" -Destination artifacts
          Copy-Item -LiteralPath (Join-Path $download 'package-smoke-diagnostics.json') -Destination artifacts
          @{
            sourceRun = 40907990313; sourceCommit = $sourceCommit; sourceTreeSha256 = $sourceTree
            originalDirty = $build.dirty; zipSha256 = $zipHash; orchestrationCommit = $env:GITHUB_SHA
            basis = 'Exact immutable ZIP with passing native application checks; all installer inputs execute from its verified source snapshot.'
          } | ConvertTo-Json | Set-Content -LiteralPath artifacts/installer-source-provenance.json -Encoding utf8
          "FLOWHUB_VERIFIED_BUNDLE=$bundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FLOWHUB_VERIFIED_SOURCE=$sourceCopy" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FLOWHUB_VERIFIED_NODE=$runtime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fetch exact pinned NSIS bytes from official mirrors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'fh-nsis.zip'
          & $env:FLOWHUB_VERIFIED_NODE --use-env-proxy scripts/fetch-nsis.mjs --output "$archive" --diagnostics artifacts/nsis-download-diagnostics.json --pin "$env:FLOWHUB_VERIFIED_BUNDLE/source/installer/windows/toolchain.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FLOWHUB_NSIS_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile original verified installer source on native Windows
        shell: pwsh
        run: |
          & $env:FLOWHUB_VERIFIED_NODE "$env:FLOWHUB_VERIFIED_SOURCE/scripts/windows-installer.mjs" --bundle "$env:FLOWHUB_VERIFIED_BUNDLE" --nsis-archive "$env:FLOWHUB_NSIS_ARCHIVE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native installation, same-version reinstall and uninstall
        shell: pwsh
        run: |
          & $env:FLOWHUB_VERIFIED_NODE "$env:FLOWHUB_VERIFIED_SOURCE/scripts/smoke-windows-installer.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native candidate and diagnostic evidence
        if: always() && !cancelled()
        shell: pwsh
        run: |
          if ($env:FLOWHUB_VERIFIED_SOURCE -and (Test-Path -LiteralPath "$env:FLOWHUB_VERIFIED_SOURCE/artifacts")) {
            Get-ChildItem -LiteralPath "$env:FLOWHUB_VERIFIED_SOURCE/artifacts" -File | Copy-Item -Destination artifacts -Force
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: flowhub-windows-installer
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14
