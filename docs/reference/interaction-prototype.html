function head(title,subtitle,actions='',pill=''){return `<div class="page-head"><div><div class="eyebrow">MCP WORKFLOW HUB</div><h1>${title}${pill}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions}</div></div>`}
function footer(){return `<div class="footnote"><span>${svg('shield',11)} 本原型仅演示交互 · 数据与运行结果均为模拟</span><span>FlowHub Design Preview · 0.1</span></div>`}
function navigate(page){state.page=page;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('breadcrumb').textContent=pageLabels[page];document.getElementById('sidebar').classList.remove('mobile-open');render();window.scrollTo(0,0)}
function render(){document.getElementById('workspace').innerHTML=({editor:renderEditor,library:renderLibrary,registry:renderRegistry,environments:renderEnvironments,runs:renderRuns,settings:renderSettings})[state.page]();hydrate();bindPageEvents()}
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.page)));
function toggleMobileNav(){document.getElementById('sidebar').classList.toggle('mobile-open')}
function changeEnv(v){if(activeRun()){toast('运行期间环境已锁定。请完成或取消当前运行后切换。');render();return}state.env=v;state.dirty=false;render();toast(`已打开${envData[v].label}的独立工作流版本`)}
function node(id,cls,icon,title,subtitle,type,detail){return `<button aria-label="配置 ${title}" class="node ${cls} ${state.selected===id?'selected':''}" onclick="selectNode('${id}')"><div class="node-head"><span class="node-icon ${cls==='logs'?'orange':cls==='agent'?'purple':cls==='report'?'green':''}">${svg(icon,16)}</span><div><div class="node-name">${title}</div><div class="node-sub">${subtitle}</div></div><span class="node-type">${type}</span></div><div class="node-details">${detail}</div></button>`}
function renderEditor(){const e=envData[state.env];return head(`${e.short}问题排查`, '连接工具，约束环境，让每一次调查都有可重复的执行路径。',button('校验','checkCircle','validateFlow()')+button('发布版本','arrowUp','publishFlow()')+button('模拟运行','play','openRunModal()','primary'),`<span class="pill gray">v1.0.${state.version}</span>`)+`
 <div class="editor-toolbar"><div class="toolbar-left"><div class="segmented"><button class="active" onclick="toast('当前为可视化编排视图')">编排</button><button onclick="showDefinition()">定义</button></div><span class="divider-v"></span><span class="badge-icon" style="color:#86a1c1">${svg('shield',12)}<select class="env-select" aria-label="切换工作流环境" onchange="changeEnv(this.value)" ${activeRun()?'disabled':''}><option value="production" ${state.env==='production'?'selected':''}>生产工作流</option><option value="staging" ${state.env==='staging'?'selected':''}>试运行工作流</option></select></span></div><div class="toolbar-right"><span class="saved">${svg(state.dirty?'clock':'check',11)}${state.dirty?'有未发布变更':'已保存至本地草稿（模拟）'}</span><span class="divider-v"></span><button class="icon-btn" onclick="openHelp()" aria-label="画布帮助">${svg('help',14)}</button></div></div>
 <div class="editor"><aside class="palette"><div class="panel-label">节点库 <span style="color:#a1b3c9">${svg('layers',13)}</span></div><div class="searchbox">${svg('search',12)}<input id="palette-search" placeholder="搜索节点" aria-label="搜索节点"></div><div class="palette-group"><div class="group-caption">基础节点</div>${palette('input','输入参数','input')}${palette('agent','Agent 推理','sparkles','purple')}${palette('condition','互斥条件','branch')}${palette('parallel','并行汇合','parallel')}${palette('approval','人工确认','person','orange')}${palette('report','生成报告','file','green')}</div><div class="palette-group"><div class="group-caption">已连接工具</div>${palette('logs',e.log,'cloud','orange',e.server)}${palette('database','业务数据库查询','database','', 'MCP 4 · 2 个环境配置')}</div><div class="palette-foot"><strong>${svg('plug',11)} 一个 Gateway MCP</strong>节点引用现有工具，新增工作流不会增加客户端 MCP 连接。</div></aside>
 <section class="canvas" aria-label="工作流可视化画布"><div class="canvas-heading"><span>WORKFLOW CANVAS</span></div><div class="flow-stage" id="flow-stage" style="transform:scale(${state.zoom})"><div class="flow-line"></div>${[94,222,349,476,605].map(y=>`<div class="arrow-pip" style="top:${y}px"></div>`).join('')}<button class="node start ${state.selected==='input'?'selected':''}" onclick="selectNode('input')">${svg('input',13)} 任务输入</button>${node('logs','logs','cloud',e.log,e.server,'MCP TOOL',`<code>${e.tool}</code><span class="lock-label">${svg('lock',9)} ${e.short}</span>`)}<span class="connector-label a">logs · evidence[]</span>${node('agent','agent','sparkles','分析证据与查询策略','由 Codex 在客户端完成推理','AGENT TASK',`<span class="pill purple">需要 Agent 返回</span><span style="margin-left:auto;font-size:8px">结构化交接</span>`)}<span class="connector-label b">plan · orderNo</span>${node('database','database','database','核对业务数据',e.db,'MCP TOOL',`<code>query_records</code><span class="lock-label">${svg('lock',9)} ${e.short} · 只读</span>`)}<span class="connector-label c">records · evidenceRefs</span>${node('report','report','file','生成标准排查报告','Codex 客户端 Skill','HOST SKILL',`<code>incident-report</code><span class="lock-label">${svg('file',9)} Markdown</span>`)}<span class="connector-label d">report · artifact_ref</span><button class="node end" onclick="selectNode('end')">${svg('checkCircle',13)} 完成</button></div><div class="node-float"><b>${svg('shield',10)} 环境策略已锁定</b>生产 / 试运行凭据独立<br>运行参数不可覆盖绑定</div><div class="canvas-tools"><button onclick="zoom(-.1)" aria-label="缩小">−</button><span class="zoom">${Math.round(state.zoom*100)}%</span><button onclick="zoom(.1)" aria-label="放大">+</button><span class="divider-v"></span><button onclick="zoom(0,true)" aria-label="适应画布">${svg('maximize',12)}</button></div><div class="canvas-note">${svg('lock',10)} 拓扑示意 · 点击节点配置</div></section>
 <aside class="inspector" id="inspector">${inspector()}</aside></div><div class="proto-mobile-note">点击节点查看配置面板。桌面宽屏可同时查看节点库、画布和配置。</div>${footer()}`}
function palette(id,label,icon,color='',sub=''){const planned=id==='parallel';return `<button class="palette-item" data-search="${label}" ${planned?'disabled aria-disabled="true" title="V1.1 计划能力，V1.0 不可添加"':`onclick="paletteSelect('${id}')"`}><span class="tiny-icon ${color}">${svg(icon,13)}</span><span><strong>${label}</strong>${planned?'<small>V1.1 · 暂不可添加</small>':sub?`<small>${sub}</small>`:''}</span></button>`}
function paletteSelect(id){if(id==='parallel'){toast('并行汇合计划于 V1.1 提供，V1.0 不可添加');return}if(['logs','database','agent','report','input'].includes(id)){selectNode(id);return}openDetail('节点能力预览',`${id==='condition'?'互斥条件':id==='parallel'?'并行汇合':'人工确认'}<div class="well">本原型的主流程保持固定。正式产品中可从节点库拖入画布，配置类型安全的条件或审批策略，并在发布前进行拓扑校验。</div><p style="font-size:11px;line-height:1.9;color:#7d94af">${id==='approval'?'人工审批由具有管理权限的用户通过界面完成，Agent 不能调用工具自行批准。':id==='parallel'?'只允许结构化分叉与汇合；每个分支独立保留证据，失败策略在发布前确定。':'仅允许声明式表达式。禁止执行任意 JavaScript、Shell 或未经授权的动态工具调用。'}</p>`)}
function inspector(){const e=envData[state.env];const names={input:['input','任务输入','Input schema'],logs:['cloud',e.log,'MCP Tool'],agent:['sparkles','分析证据与查询策略','Agent task'],database:['database','核对业务数据','MCP Tool'],report:['file','标准排查报告','Host-side skill'],end:['checkCircle','结束与结果','Output contract']};const n=names[state.selected]||names.database;return `<h2>节点配置<button class="icon-btn" onclick="closeInspector()" aria-label="关闭节点配置">${svg('close',13)}</button></h2><div class="node-info-title"><span class="node-icon ${state.selected==='agent'?'purple':''}">${svg(n[0],18)}</span><div><strong>${n[1]}</strong><small>${n[2]} · ${state.selected}</small></div></div><div class="tabs-line"><button class="${state.tab==='config'?'active':''}" onclick="switchTab('config')">配置</button><button class="${state.tab==='output'?'active':''}" onclick="switchTab('output')">输出</button></div>${state.tab==='output'?outputInspector():configInspector()}`}
function configInspector(){const e=envData[state.env];if(state.selected==='database')return `<div class="field"><label>MCP Server <span class="pill gray">已发现</span></label><input value="business-db · MCP 4" disabled></div><div class="field"><label>使用工具</label><input value="query_records" disabled><div class="field-hint">Schema 固定于发布版本 · 不自动跟随远端变更</div></div><div class="env-card"><div class="cap">${svg('shield',12)} 环境绑定 <span>${svg('lock',11)} 不可覆盖</span></div><strong>${e.label} · READ ONLY</strong><p>${e.db}<br>专属连接凭据 · 配置版本 rev.3</p><div class="mock-verification-inline">模拟已验证 · MOCK_VERIFIED</div></div><div class="field"><label>输入映射</label><input value="node:plan /orderNo" readonly><div class="field-hint">只允许传入发布时声明的业务查询参数</div></div><div class="divider-h"></div><div class="toggle-row"><span>仅允许只读查询</span><input class="switch" type="checkbox" checked disabled aria-label="只读查询已锁定"></div><div class="toggle-row"><span>查询前人工确认</span><input class="switch" type="checkbox" ${state.requireApproval?'checked':''} ${activeRun()?'disabled':''} onchange="toggleApproval(this.checked)" aria-label="查询前人工确认"></div><div class="notice">${svg('shield',11)} 环境约束由服务端与数据库只读凭据共同执行，不依赖提示词。</div>`;
if(state.selected==='logs')return `<div class="field"><label>MCP Server</label><input value="${e.server}" disabled></div><div class="field"><label>使用工具</label><input value="${e.tool}" disabled></div><div class="env-card"><div class="cap">环境绑定 ${svg('lock',11)}</div><strong>${e.label}</strong><p>查询范围限定在此环境的日志服务。</p><div class="mock-verification-inline">模拟已验证 · MOCK_VERIFIED</div></div><div class="field"><label>时间范围</label><input value="$.input.time_range" readonly></div><div class="field"><label>查询关键词</label><input value="$.input.order_no" readonly></div><div class="notice">请求超时 20 秒 · 只读步骤最多重试 2 次 · 返回结果先脱敏再交给 Agent。</div>`;
if(state.selected==='agent')return `<div class="field"><label>执行位置 <span class="pill purple">Codex</span></label><input value="客户端推理 · 不在 Hub 内调用模型" disabled></div><div class="field"><label>任务目标</label><textarea readonly>分析日志证据，提出可验证的原因假设，并返回业务查询参数。不能改变运行环境或调用未授权工具。</textarea></div><div class="field"><label>返回结构</label><input value="queryNeeded + orderNo + reason + evidenceRefs" readonly></div><div class="notice">到达此节点时进入 WAITING_AGENT。Codex 读取证据后提交结构化结果，服务端校验通过才继续。</div><div class="divider-h"></div><span class="pill purple">Agent 推理 ≠ 人工审批</span>`;
if(state.selected==='report')return `<div class="field"><label>报告方式</label><input value="Codex 客户端 Skill" disabled></div><div class="field"><label>Skill 引用</label><input value="incident-report" readonly></div><div class="field"><label>输出格式</label><input value="Markdown + evidence references" readonly></div><div class="notice amber">Skill 不是 MCP Tool。此节点向 Codex 交接报告要求，不在 Hub 服务端直接执行客户端 Skill。</div><div class="divider-h"></div><div class="field"><label>必填报告章节</label><textarea readonly>事件摘要、环境与范围、证据、原因假设、置信度、后续动作、未验证事项</textarea></div>`;
if(state.selected==='input')return `<div class="field"><label>输入参数</label><input value="order_no · time_range · description" readonly></div><div class="field"><label>示例订单号</label><input value="DEMO-20261029-001" readonly></div><div class="env-card"><div class="cap">执行环境 ${svg('lock',11)}</div><strong>${e.label}</strong><p>环境来自发布版本，不出现在可覆盖的任务参数中。</p></div><div class="notice">必填项缺失时要求用户补充，不猜测订单、租户或查询时间。</div>`;
return `<div class="field"><label>结果判定</label><input value="required artifacts + verified steps" disabled></div><div class="notice">只有必需步骤与结果校验通过才标记 SUCCEEDED。空日志、超时和缺少证据不能视为排查成功。</div>`}
function outputInspector(){const data={logs:{logs:'LogEvidence[]',trace_ids:'string[]',result_ref:'artifact_id'},database:{records:'BusinessRecord[]',environment:state.env,result_ref:'artifact_id'},agent:{queryNeeded:'boolean',orderNo:'string',reason:'string',evidenceRefs:['artifact_id']},report:{report_ref:'artifact_id',evidenceRefs:['artifact_id'],verification:'client_submitted'},input:{order_no:'string',time_range:'TimeRange',description:'string'},end:{run_id:'string',status:'SUCCEEDED',artifacts:['artifact_id']}};return `<div class="panel-label">输出契约 <span class="pill gray">JSON</span></div><pre class="code-box" style="font-size:10px">${escapeHtml(JSON.stringify(data[state.selected],null,2))}</pre><div class="notice">此处是类型结构示例。真实执行结果保存在独立运行记录中。</div>`}
function selectNode(id){state.selected=id;state.tab='config';document.querySelectorAll('.node').forEach(x=>x.classList.remove('selected'));if(state.page==='editor'){render();if(window.innerWidth<=760)document.getElementById('inspector').classList.add('mobile-inspector')}}
function closeInspector(){if(window.innerWidth<=760){document.getElementById('inspector').classList.remove('mobile-inspector')}else{toast('点击画布中的其他节点可切换配置')}}
function switchTab(tab){state.tab=tab;document.getElementById('inspector').innerHTML=inspector()}
function toggleApproval(v){state.requireApproval=v;state.dirty=true;toast(v?'已启用独立人工确认节点（草稿）':'已关闭可选人工确认；环境与只读约束仍生效');render()}
function zoom(delta,reset){state.zoom=reset?1:Math.max(.65,Math.min(1.2,state.zoom+delta));render()}
function validateFlow(){toast('校验通过：6 个步骤、环境绑定完整、所有 Tool Schema 匹配（模拟）')}
function publishFlow(){if(activeRun()){toast('请完成当前模拟运行后再发布新版本');return}openModal('发布工作流版本','发布后生成不可变执行快照，后续修改只影响草稿。',`<div class="well">工作流：${envData[state.env].short}问题排查<br>新版本：v1.0.${state.version+1}<br>锁定内容：拓扑、工具 Schema、环境绑定、权限策略</div><div class="field"><label>发布说明</label><input id="release-note" value="完善环境隔离与查询策略" placeholder="本次变更摘要"></div>`,button('取消','','closeModal()')+button('确认发布','arrowUp','confirmPublish()','primary'))}
function confirmPublish(){state.version++;state.dirty=false;closeModal();render();toast(`v1.0.${state.version} 已在原型中发布，Gateway 工具数量仍为 7`)}
function showDefinition(){openDetail('工作流定义',`<div class="pill">示意 DSL · 非实际配置导出</div><pre>${escapeHtml(`id: ${state.env==='production'?'prod':'staging'}-incident\nversion: 1.0.${state.version}\nmode: guided\nenvironment_ref: ${state.env}@3\nsteps:\n  - input\n  - ${envData[state.env].server}/${envData[state.env].tool}\n  - agent_task: analyze_evidence\n  - business-db/query_records\n  - host_skill: incident-report\n  - end\npolicy:\n  read_only: true\n  environment_override: false\n  human_approval: ${state.requireApproval}`)}</pre><div class="notice">模型只能补充经 Schema 约束的业务参数，不能变更以上策略。</div>`)}
function renderLibrary(){const e=envData[state.env];const cards=[{id:'prod',name:'生产问题排查',desc:'阿里云日志与生产数据库关联分析，生成标准事件报告。',icon:'shield',color:'',env:'production',type:'生产',status:'已发布',version:`v1.0.${state.version}`,nodes:6},{id:'staging',name:'试运行问题排查',desc:'查询华为云日志，核对试运行环境业务数据与异常链路。',icon:'activity',color:'green',env:'staging',type:'试运行',status:'已发布',version:`v1.0.${state.version}`,nodes:6},{id:'health',name:'MCP 连接巡检',desc:'发现工具变更，检查连接可用性与环境配置完整性。',icon:'plug',color:'purple',env:'all',type:'通用',status:'草稿',version:'草稿',nodes:4},...state.createdFlows];const filtered=cards.filter(c=>(state.filter==='all'||c.env===state.filter));return head('工作流','把团队的排查经验沉淀成可发现、可验证的执行方案。',button('新建工作流','plus','openNewFlow()','primary'))+`<div class="stats-grid"><div class="stat"><div class="label">执行方案</div><div class="value">${cards.length}<small>条</small></div><div class="delta">发现、选择、重复使用</div></div><div class="stat"><div class="label">Gateway MCP</div><div class="value">1<small>个</small></div><div class="delta">固定入口，不随工作流增加</div></div><div class="stat"><div class="label">下游 MCP</div><div class="value">4<small>个</small></div><div class="delta">独立连接与环境凭据</div></div><div class="stat"><div class="label">环境策略</div><div class="value">2<small>套</small></div><div class="delta">生产与试运行隔离</div></div></div><div class="filter-bar"><div class="filter-tags"><button class="filter-tag ${state.filter==='all'?'active':''}" onclick="filterLibrary('all')">全部工作流</button><button class="filter-tag ${state.filter==='production'?'active':''}" onclick="filterLibrary('production')">生产</button><button class="filter-tag ${state.filter==='staging'?'active':''}" onclick="filterLibrary('staging')">试运行</button></div><div class="searchbox">${svg('search',13)}<input id="workflow-search" placeholder="搜索工作流名称或描述" aria-label="搜索工作流"></div></div><div class="workflow-grid" id="workflow-cards">${filtered.map(c=>`<article tabindex="0" role="button" class="workflow-card" data-search="${escapeHtml(c.name+' '+c.desc)}" onclick="openWorkflow('${c.env}')" onkeydown="if(event.key==='Enter')openWorkflow('${c.env}')"><div class="head"><div class="large-icon ${c.color}">${svg(c.icon,21)}</div><span class="pill ${c.status==='草稿'?'gray':'green'}">${c.status}</span></div><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.desc)}</p><div class="mini-flow"><i>${svg('input',13)}</i>${svg('arrowRight',10)}<i>${svg('cloud',13)}</i>${svg('arrowRight',10)}<i>${svg('database',13)}</i>${svg('arrowRight',10)}<i>${svg('file',13)}</i></div><div class="card-footer"><span>${c.nodes} 个步骤 · ${c.type}</span><span>${c.version}</span></div></article>`).join('')}</div><div class="info-wide">${svg('sparkles',17)}<div>当你说“排查生产问题并生成报告”，Codex 可通过同一个 Gateway 查询工作流，获取输入契约并启动运行。<br>名称相近或缺少关键信息时，应向用户确认，而不是自动猜测环境。</div></div>${footer()}`}
function filterLibrary(v){state.filter=v;render()}
function openWorkflow(env){if(env==='all'){openDetail('MCP 连接巡检','<div class="pill gray">草稿示例</div><div class="well">检查已配置服务器的连接状态 → 获取 Tools Schema → 比对版本指纹 → 生成巡检摘要。</div><p style="color:#8a9db6;font-size:11px;line-height:1.9">原型展示完整的生产与试运行工作流。连接巡检留作通用模板示例。</p>');return}if(activeRun()&&state.env!==env){toast('当前运行环境已锁定，请先完成或取消运行');return}state.env=env;navigate('editor')}

function renderRegistry(){const s=[...servers,...state.custom].find(x=>x.id===state.server)||servers[0];const rows=toolRows[s.id]||[['demo_tool','新接入的模拟工具','readOnly','input']];return head('MCP 工具库','发现可用能力，按工具选择节点；连接与凭据由本地 Hub 管理。',button('刷新发现','refresh','refreshDiscovery()')+button('添加 MCP','plus','openAddMcp()','primary'))+`<div class="gateway-banner"><div class="left"><div class="emblem">${svg('plug',27)}</div><div><h2>统一入口，独立的下游连接</h2><p>Codex 只连接 FlowHub。下游 MCP 不需要逐条注册到客户端。</p></div></div><div class="right"><span class="pill">1 个 Gateway</span><div class="banner-label">7 个固定工具 · ${4+state.custom.length} 个下游服务</div></div></div><div class="mcp-layout"><div class="server-list"><h3>已配置的 MCP SERVERS</h3>${[...servers,...state.custom].map(x=>`<button class="server-item ${x.id===state.server?'active':''}" onclick="selectServer('${x.id}')"><span class="tiny-icon">${svg(x.icon,14)}</span><span><strong>${escapeHtml(x.name)}</strong><small>${escapeHtml(x.sub)}</small></span><span class="count">${x.count}</span></button>`).join('')}</div><div><div class="table-container"><div class="table-header"><div><h2>${escapeHtml(s.name)} <span class="pill green">已连接 · 模拟</span></h2><p>Streamable HTTP · Schema 已缓存 · 指纹已固定</p></div><button class="icon-btn" onclick="showServerDetail()" aria-label="连接详情">${svg('settings',16)}</button></div><div style="padding:0 20px 17px"><div class="searchbox">${svg('search',13)}<input id="tool-search" placeholder="搜索工具名称、功能或参数" aria-label="搜索 MCP 工具"></div></div><table class="tool-table"><thead><tr><th>工具 / 能力</th><th>风险提示</th><th>主要参数</th><th></th></tr></thead><tbody id="tool-rows">${rows.map(r=>`<tr data-search="${escapeHtml(r.join(' '))}"><td><strong>${r[0]}</strong>${r[1]}</td><td><span class="pill green">只读声明</span></td><td><code style="font-size:9px">${r[3]}</code></td><td><button class="btn small" onclick="showTool('${r[0]}','${r[1]}')">查看</button></td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:16px">${svg('shield',12)} Tool 的 readOnly 声明仅作为提示。生产安全仍需结合凭据权限、工具白名单、资源范围与执行策略。</div></div></div>${footer()}`}

function renderEnvironments(){return head('环境与权限','把环境选择变成可验证的配置边界，而不是一句提示词。',button('查看策略','shield','showPolicy()'))+`<div class="profile-grid">${Object.entries(envData).map(([id,e])=>`<article class="environment-card"><div class="heading"><div><div class="eyebrow">IMMUTABLE PROFILE</div><h2>${e.label}</h2><small>${id} · rev.3 · 已锁定</small></div><span class="pill ${e.color} mock-verification">${svg('shield',11)}<span>模拟已验证<small>MOCK_VERIFIED</small></span></span></div><dl><div><dt>日志连接</dt><dd>${e.server}</dd></div><div><dt>数据库连接</dt><dd>${e.db}</dd></div><div><dt>凭据引用</dt><dd>vault://${id}/db-readonly</dd></div><div><dt>资源范围</dt><dd>${id==='production'?'billing_prod.readonly':'billing_staging.readonly'}</dd></div><div><dt>最大查询行数</dt><dd>100 行 / 次</dd></div><div><dt>写操作</dt><dd><span class="pill red">拒绝</span></dd></div></dl><div class="env-footer"><span>${svg('shield',11)} 不接受运行参数覆盖</span>${button('创建新修订','copy',`newProfileRevision('${id}')`,'small')}</div></article>`).join('')}</div><div class="info-wide">${svg('lock',18)}<div><strong style="font-weight:550">发布时固定版本，运行时重新检查权限。</strong><br>连接凭据可以撤销，撤销立即阻止后续调用。已发布工作流不会因编辑草稿而改变；模型无法通过参数切换生产与试运行数据库。</div></div><div class="section-card" style="margin-top:20px"><h2>当前策略边界</h2><p class="description">只约束经由 FlowHub 发起的调用。客户端中其他独立 MCP、Shell 或网络工具并不受本工具控制。</p><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill">服务端 Tool 白名单</span><span class="pill">只读账户</span><span class="pill">凭据不外发</span><span class="pill">环境指纹校验</span><span class="pill">敏感字段脱敏</span><span class="pill">调用审计</span></div></div>${footer()}`}

function openRunModal(){if(activeRun()){navigate('runs');toast('已有模拟运行，环境和版本已锁定');return}openModal('启动模拟运行',`固定工作流：${envData[state.env].short}问题排查 · v1.0.${state.version}`,`<div class="field"><label>订单号 <span>必填</span></label><input id="run-order" value="DEMO-20261029-001"></div><div class="field"><label>问题描述</label><textarea id="run-desc">订单支付成功后账单仍显示未缴费，请核对日志与业务记录。</textarea></div><div class="env-card"><div class="cap">${svg('lock',12)} 环境不可覆盖</div><strong>${envData[state.env].label} · 只读权限</strong><p>原型只调用预置模拟数据，不会访问日志服务或数据库。</p></div>`,button('取消','','closeModal()')+button('开始模拟','play','startRun()','primary'))}
function startRun(){const order=document.getElementById('run-order').value.trim();if(!order){toast('订单号不能为空');return}state.runOrder=order;state.runEnv=state.env;state.runVersion=state.version;state.runId='DEMO-'+new Date().toISOString().slice(11,19).replace(/:/g,'');state.runStatus='RUNNING';state.runCompleted=1;state.runApprovalRequired=state.requireApproval;closeModal();navigate('runs');state.runTimer=setTimeout(()=>{state.runStatus='WAITING_AGENT';state.runCompleted=2;if(state.page==='runs')render();toast('日志证据已准备：等待 Codex 返回结构化分析（模拟）')},1000)}
function advanceAgent(){state.runCompleted=state.runApprovalRequired?3:4;state.runStatus=state.runApprovalRequired?'WAITING_APPROVAL':'RUNNING';render();if(state.runApprovalRequired){toast('模拟分析校验通过。下一步需要独立人工确认。')}else{finishRun()}}
function approveRun(){toast('人工确认已记录（仅演示）');state.runStatus='RUNNING';state.runCompleted=4;render();finishRun()}
function finishRun(){state.runTimer=setTimeout(()=>{state.runStatus='SUCCEEDED';state.runCompleted=6;if(state.page==='runs')render();toast('模拟链路已完成，报告与证据摘要可查看')},900)}
function cancelRun(){if(state.runTimer)clearTimeout(state.runTimer);state.runStatus='CANCELLED';render();toast('模拟运行已取消，不再执行后续步骤')}
function rejectRun(){if(state.runTimer)clearTimeout(state.runTimer);state.runStatus='REJECTED';state.runCompleted=3;render();toast('本次查询已被人工拒绝（演示），后续数据查询和报告步骤未执行')}
function renderRuns(){const status=state.runStatus;const empty=status==='IDLE';const done=status==='SUCCEEDED';const waiting=status==='WAITING_AGENT';const approval=status==='WAITING_APPROVAL';const e=envData[state.runEnv];const labels={IDLE:['尚无运行','gray'],RUNNING:['执行中 · 模拟','',],WAITING_AGENT:['等待 Agent','purple'],WAITING_APPROVAL:['等待人工确认','amber'],SUCCEEDED:['已完成 · 模拟','green'],CANCELLED:['已取消','gray'],REJECTED:['人工已拒绝 · 模拟','red']};const l=labels[status];return head('运行详情',empty?'从工作流启动一次模拟运行，查看每一步的证据、约束和交接。':`${state.runId} · ${e.short}问题排查 · 不可变执行快照`,(activeRun()?button('取消运行','stop','cancelRun()','danger'):button('重新模拟','play','openRunModal()','primary'))+button('全部工作流','grid',"navigate('library')"),`<span class="pill ${l[1]}">${l[0]}</span>`)+(empty?`<div class="section-card empty-note" style="padding:90px 25px"><div class="large-icon" style="margin:0 auto 18px">${svg('activity',22)}</div><h2>运行过程，不再是黑盒</h2><p style="line-height:1.9">预置流程演示 Agent 判断、人工审批、环境隔离和报告交接。</p>${button('运行生产排查示例','play','openRunModal()','primary')}</div>${footer()}`:`<div class="runs-layout"><aside class="section-card run-stepper">${runSteps(status)}</aside><section class="section-card"><div class="run-summary"><div>运行环境<strong>${svg('lock',11)} ${e.label}</strong></div><div>调用来源<strong>Codex · 演示客户端</strong></div><div>工作流版本<strong>v1.0.${state.runVersion??state.version}</strong></div><div>数据范围<strong>100 行 · 只读</strong></div></div><h2>事件证据与下一步</h2><p class="description">订单 ${escapeHtml(state.runOrder||'DEMO-20261029-001')} · 所有内容均为人工构造的示例。</p><div class="evidence"><div class="cap"><span>${svg('cloud',12)} 日志证据 · evidence-001</span><span class="pill gray">已脱敏</span></div><pre>[09:42:18.031] payment.callback accepted\n[09:42:18.184] bill.update transaction rolled back\n[09:42:18.186] exception: DEMO_CONCURRENT_UPDATE\ntrace_id: demo-trace-001</pre></div>${waiting?`<div class="agent-task"><h3>${svg('sparkles',17)} 等待 Codex 分析证据</h3><p>Hub 暂停执行并返回任务说明、证据引用与输出 Schema。<br>Codex 应提供原因假设和查询参数，不能修改环境与权限。</p><div class="code-box" style="font-size:9px;margin-bottom:15px">${escapeHtml(JSON.stringify({queryNeeded:true,orderNo:state.runOrder||'DEMO-20261029-001',reason:'需要核对订单当前状态',evidenceRefs:['evidence-001']},null,2))}</div>${button('提交模拟 Agent 结果','sparkles','advanceAgent()','primary')}<p style="margin:12px 0 0;font-size:9px">此按钮只演示协议交接，不会调用真实模型。</p></div>`:approval?`<div class="approval-task"><h3>${svg('person',16)} 请求独立人工确认</h3><p>拟调用 business-db / query_records。<br>环境：${e.label}；权限：只读；对象：演示订单；最多返回 100 行。</p><div class="actions">${button('拒绝本次查询','','rejectRun()')}${button('人工批准（演示）','check','approveRun()','primary')}</div><p style="margin-bottom:0;font-size:9px">正式产品仅允许具备审批权限的人在管理界面批准。Agent 不能自行批准。</p></div>`:done?`<div class="evidence"><div class="cap"><span>${svg('database',12)} 数据核对 · evidence-002</span><span class="pill green">${e.short} · 只读</span></div><pre>payment.status = SUCCESS\nbill.status = UNPAID\nupdate_attempts = 2\n结论：模拟数据符合并发回滚场景，真实原因仍需实际证据。</pre></div><div class="agent-task" style="background:#f2faf6;border-color:#dfeee5"><h3 style="color:#5b957d">${svg('file',17)} 标准报告已生成（模拟）</h3><p style="color:#7f9d8f">正式执行中，此步骤由 Codex 客户端 Skill 生成并回传结果。<br>本演示提供固定报告，不能作为真实生产结论。</p>${button('查看报告','eye','viewReport()')}${button('下载模拟报告','download','downloadReport()','primary')}</div>`:status==='REJECTED'?`<div class="notice amber">本次查询已由人工拒绝，运行状态为 REJECTED。数据库查询未执行，报告步骤未启动；保留此前的模拟日志证据与审批事件。此状态与主动取消 CANCELLED 分开记录。</div>`:status==='CANCELLED'?`<div class="notice">运行已取消。已采集的模拟证据保留，后续步骤不再执行；取消不等于撤销已完成操作。</div>`:`<div class="notice">${svg('refresh',12)} 正在处理模拟步骤… 云端模型和真实 MCP 均未被调用。</div>`}</section></div>${footer()}`)}
function runSteps(status){const done=status==='SUCCEEDED';const count=done?6:Number(state.runCompleted||0);const rejected=status==='REJECTED';const stepArr=[['任务输入','参数与环境检查','input',count>=1?'done':''],['查询日志','MCP 1 / 2 · 只读','cloud',count>=2?'done':status==='RUNNING'?'current':''],['Agent 分析','Codex 客户端推理','sparkles',count>=3?'done':status==='WAITING_AGENT'?'current':''],['人工确认',rejected?'本次查询已拒绝':state.runApprovalRequired===false?'此版本未要求确认 · 已跳过':'用户批准，与 Agent 分开','person',count>=4?'done':status==='WAITING_APPROVAL'?'wait':rejected?'rejected':''],['核对业务数据','MCP 4 · 环境已绑定','database',count>=5?'done':status==='RUNNING'&&count>=4?'current':''],['报告交接与完成','客户端 Skill · 示例报告','file',done?'done':'']];return `<div class="panel-label" style="margin-bottom:25px">执行时间线 <span class="pill gray">${count} / 6</span></div>`+stepArr.map((x,i)=>`<div class="run-step ${x[3]}"><span class="step-bullet">${svg(x[3]==='done'?'check':x[3]==='rejected'?'close':x[2],13)}</span><div><strong>${x[0]}</strong><small>${x[1]}</small></div></div>`).join('')}
function reportText(){return `# 事件排查报告（模拟）\n\n> UI 原型生成，全部为模拟数据，不代表真实生产调查。\n\n## 事件摘要\n订单 ${state.runOrder||'DEMO-20261029-001'} 在模拟支付成功后仍显示未缴费。\n\n## 环境与范围\n${envData[state.runEnv].label}，只读查询，最多 100 行。\n\n## 证据\n- evidence-001：模拟日志显示 bill.update transaction rolled back。\n- evidence-002：模拟数据 payment.status=SUCCESS，bill.status=UNPAID。\n\n## 原因假设\n示例并发更新导致事务回滚。此结论只适用于模拟数据。\n\n## 后续动作\n在授权测试环境复现，检查事务边界、幂等与补偿策略。\n\n## 未验证事项\n真实日志、实际数据库和生产故障原因均未验证。\n`}
function viewReport(){openDetail('标准排查报告 · 模拟',`<pre style="font-family:inherit;line-height:2;font-size:12px">${escapeHtml(reportText())}</pre>`)}
function downloadReport(){const blob=new Blob([reportText()],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='flowhub-demo-report.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载模拟报告，不含任何真实系统数据')}
function renderSettings(){return head('接入设置','客户端只连接一个 Gateway；工具数量不会随着工作流增长。',button('复制接入示例','copy','copyConfig()','primary'))+`<div class="settings-grid"><section class="section-card"><h2>连接 Codex</h2><p class="description">以下地址是产品设计示例。本交互原型并未启动 MCP 服务。</p><div class="code-box" id="config-snippet">[mcp_servers.flowhub]\nurl = "http://127.0.0.1:18473/mcp"\nbearer_token_env_var = "FLOWHUB_TOKEN"</div><div class="well">${svg('lock',12)} 令牌仅配置在本机环境变量或系统凭据存储，不应写入公开仓库。</div><div class="divider-h"></div><h2>固定 MCP Tools</h2><p class="description">查询方案、启动执行、分步推进、读取状态。与工作流数量无关。</p><div class="tools-grid">${['workflow_search','workflow_get','workflow_start','workflow_advance','workflow_status','workflow_cancel','artifact_read'].map(x=>`<div class="fixed-tool">${svg('code',10)} ${x}</div>`).join('')}</div></section><section class="section-card"><h2>运行与隐私</h2><p class="description">本地优先、显式授权、默认不上传企业业务数据。</p><div class="setting-row"><div><strong>本地服务绑定</strong><small>仅监听 loopback 地址</small></div><span class="pill">127.0.0.1</span></div><div class="setting-row"><div><strong>默认权限</strong><small>拒绝未授权 Tool 与跨环境调用</small></div><span class="pill green">只读</span></div><div class="setting-row"><div><strong>审计记录</strong><small>保存调用元信息，不记录密钥</small></div><input class="switch" type="checkbox" checked disabled aria-label="审计已启用"></div><div class="setting-row"><div><strong>自动上传诊断</strong><small>需要用户预览并手动脱敏导出</small></div><input class="switch" type="checkbox" disabled aria-label="自动上传已禁用"></div><div class="setting-row"><div><strong>重启后凭据库</strong><small>解锁后才允许调用真实工具</small></div><span class="pill amber">锁定</span></div><div style="margin-top:21px">${button('查看部署检查清单','checkCircle','showDeployChecklist()','full')}</div></section></div><div class="info-wide">${svg('cloud',18)}<div>开发工作在 Codex Cloud 与 GitHub 完成，使用 Mock MCP 和合成测试数据。<br>真实内网验证仅在经公司批准的环境中进行；不通过本原型连接或上传企业数据。</div></div>${footer()}`}
async function copyConfig(){const txt='[mcp_servers.flowhub]\nurl = "http://127.0.0.1:18473/mcp"\nbearer_token_env_var = "FLOWHUB_TOKEN"';try{await navigator.clipboard.writeText(txt);toast('已复制产品接入示例；当前原型没有真实 MCP 服务')}catch{openDetail('接入配置示例',`<pre>${escapeHtml(txt)}</pre><p>请手动复制。</p>`)}}
function showDeployChecklist(){openDetail('本地部署验收清单',`<div class="well">1. 确认公司允许安装和运行该工具<br>2. 检查 Windows 运行包可启动<br>3. 验证文件加密策略兼容性<br>4. 使用模拟 MCP 完成自测<br>5. 配置真实环境的只读凭据<br>6. 测试 Tool 发现与环境隔离<br>7. 验证撤销凭据后立即拒绝调用<br>8. 脱敏检查诊断包后再反馈问题</div><div class="notice">若被公司策略阻止，应联系 IT 获取批准的部署路径，不绕过安全控制。</div>`)}
function openModal(title,sub,body,actions){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div style="display:flex;justify-content:space-between;gap:10px"><h2 id="modal-title">${title}</h2><button class="icon-btn" onclick="closeModal()" aria-label="关闭">${svg('close',15)}</button></div><div class="modal-sub">${sub}</div>${body}<div class="actions">${actions}</div></section></div>`;setTimeout(()=>document.querySelector('.modal input')?.focus(),20)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function openDetail(title,content){document.getElementById('detail-root').innerHTML=`<div class="modal-backdrop" style="background:#1a2e4917" onclick="if(event.target===this)closeDetail()"><aside class="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title"><button class="icon-btn close" onclick="closeDetail()" aria-label="关闭详情">${svg('close',17)}</button><div class="eyebrow" style="margin-top:10px">FLOWHUB / DETAILS</div><h2 id="detail-title">${title}</h2><div style="height:10px"></div>${content}</aside></div>`}
function closeDetail(){document.getElementById('detail-root').innerHTML=''}
function openHelp(){openModal('关于这个交互原型','FlowHub 产品 V1.0 设计预览 · 原型版本 0.1',`<div class="well">可体验：工作流切换、节点配置、工具搜索、版本发布、模拟执行、Agent 交接、独立人工确认和报告下载。<br><br>原型没有后端、不会访问网络或公司系统。所有数据为演示数据，刷新页面后会恢复初始状态。</div><div class="notice">设计目标：一个 MCP 入口、明确的环境边界、可重复的执行方案。</div>`,button('开始体验','arrowRight','closeModal()','primary'))}
function bindPageEvents(){const ps=document.getElementById('palette-search');if(ps)ps.addEventListener('input',()=>document.querySelectorAll('.palette-item').forEach(x=>x.style.display=x.dataset.search.toLowerCase().includes(ps.value.toLowerCase())?'':'none'));const ws=document.getElementById('workflow-search');if(ws)ws.addEventListener('input',()=>document.querySelectorAll('.workflow-card').forEach(x=>x.style.display=x.dataset.search.toLowerCase().includes(ws.value.toLowerCase())?'':'none'));const ts=document.getElementById('tool-search');if(ts)ts.addEventListener('input',()=>document.querySelectorAll('#tool-rows tr').forEach(x=>x.style.display=x.dataset.search.toLowerCase().includes(ts.value.toLowerCase())?'':'none'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDetail();document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('inspector')?.classList.remove('mobile-inspector')}});
hydrate();render();
</script>
</body>
</html>
