<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FlowHub 2.0 · 离线交互参考</title><style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#172b4d;--muted:#60718c;--blue:#246bfd;--line:#dce7f7;--pale:#eaf2ff;--green:#168875;--shadow:0 10px 32px rgba(54,96,160,.065)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 15px;transition:.15s}button:hover{border-color:#9dbdff;background:#f8fbff}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bad0ff;outline-offset:2px}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.soft{background:var(--pale);color:var(--blue);border:0}button:disabled{opacity:.5;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-columns:210px 1fr}.side{background:rgba(255,255,255,.88);border-right:1px solid var(--line);padding:28px 17px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:10px;align-items:center;font-size:21px;font-weight:700;letter-spacing:-.6px}.mark{width:35px;height:35px;display:grid;place-items:center;background:var(--blue);color:white;border-radius:12px}.version{font-size:10px;color:var(--muted);letter-spacing:1px}.nav{display:grid;gap:7px}.nav button{text-align:left;border:0;background:transparent;padding:11px 16px;color:var(--muted)}.nav button.active{background:var(--pale);color:var(--blue);font-weight:600}.sidefoot{margin-top:auto;font-size:12px;color:var(--muted);padding:15px;border:1px solid var(--line);border-radius:14px}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:6px}.main{min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 32px;background:rgba(255,255,255,.5);color:var(--muted);font-size:12px}.tag{display:inline-block;background:var(--pale);color:var(--blue);padding:4px 9px;border-radius:7px;font-size:11px;white-space:nowrap}.tag.green{color:var(--green);background:#e7f6f1}.tag.amber{color:#9a6a15;background:#fff6e4}.tag.gray{color:var(--muted);background:#f0f3f8}.content{padding:28px 32px 32px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.kicker{color:var(--blue);font-size:10px;letter-spacing:2px;font-weight:700}h1{font-size:27px;letter-spacing:-.7px;margin:4px 0}h2{font-size:17px;margin:0 0 7px}h3{font-size:14px;margin:0 0 6px}p{margin:6px 0;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px;font-weight:650;margin:5px 0}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:13px;padding:15px}.row .body{flex:1;min-width:0}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--pale);color:var(--blue)}.tabs{display:flex;gap:7px;margin:0 0 15px}.tabs button{border:0;padding:7px 13px;background:#f1f5fb}.tabs button.sel{background:var(--pale);color:var(--blue)}.notice{border:1px solid var(--line);background:#eef5ff;border-radius:12px;padding:12px 16px;color:#456286;font-size:12px;margin:0 0 20px}.code{padding:13px;background:#f7f9fe;border:1px solid var(--line);border-radius:10px;font:12px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow:auto;word-break:break-word}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;font-weight:600}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--ink);background:#fff}textarea{resize:vertical}.two{grid-template-columns:1fr 1fr}.workflow{position:relative;padding:25px}.workflow .mini{display:flex;align-items:center;gap:5px;margin:24px 0}.mini span{background:var(--pale);padding:8px 10px;border-radius:9px;font-size:11px}.editor{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.canvas{position:relative;min-height:580px;background-color:#f7fbff;background-image:radial-gradient(#d3e2f8 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:18px;padding:20px}.canvaslabel{position:absolute;top:18px;left:20px;color:var(--muted);font-size:11px}.nodes{margin:38px auto 18px;width:260px;display:flex;flex-direction:column;align-items:center}.node{position:relative;background:white;border:1px solid #d1e0f7;border-radius:13px;padding:12px 16px;width:240px;text-align:left;box-shadow:0 7px 20px rgba(36,78,140,.07)}.node.selected{border:2px solid var(--blue);padding:11px 15px}.node .num{color:var(--blue);font-size:10px;letter-spacing:1px}.node strong{display:block;font-size:13px}.connector{width:2px;height:25px;background:#a7c3ec;position:relative}.connector:after{content:'';position:absolute;bottom:0;left:-3px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #a7c3ec}.nodeadd{border:1px dashed #89b1ff;box-shadow:none}.bottomchip{position:absolute;bottom:17px;left:20px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:10px}.inspector{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.chatbox{background:white;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:530px}.chathead{padding:18px 20px;border-bottom:1px solid var(--line)}.messages{padding:21px;flex:1;overflow:auto;max-height:440px}.bubble{margin-bottom:15px;line-height:1.8}.bubble.user{padding:12px 14px;background:var(--pale);border-radius:13px 13px 3px 13px;margin-left:45px;color:#214f97}.bubble.bot{padding:3px 0}.tool{border:1px solid var(--line);background:#f8fbff;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:12px}.composer{padding:15px;border-top:1px solid var(--line)}.composer textarea{min-height:72px;margin-bottom:9px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);background:#f7faff;font-weight:500}th,td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}.empty{padding:26px;text-align:center;color:var(--muted)}.footnote{margin-top:20px;font-size:11px;color:var(--muted)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#183b6c;color:white;border-radius:11px;padding:12px 22px;display:none;z-index:10;box-shadow:var(--shadow)}dialog{border:1px solid var(--line);border-radius:18px;width:440px;max-width:95vw;padding:24px;box-shadow:0 20px 80px #315eaa30}dialog::backdrop{background:#1e3b6530}.railstep{border-left:2px solid var(--line);padding:0 0 17px 17px;margin-left:6px}.railstep b{font-size:12px}.pillgroup{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.progress{height:5px;background:var(--pale);border-radius:8px;overflow:hidden;margin:14px 0}.progress>i{display:block;width:100%;height:100%;background:var(--blue)}
@media(max-width:1200px){.app{grid-template-columns:180px 1fr}.content{padding:23px}.top{padding:0 23px}.split{grid-template-columns:minmax(0,1fr) 265px}.editor{grid-template-columns:minmax(0,1fr) 290px}.stats{gap:10px}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:15px;gap:12px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:8px}.sidefoot{display:none}.brand{justify-content:center}.split,.editor,.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.heading{align-items:flex-start;flex-direction:column}.content{padding:20px}.top{padding:0 20px}.row{flex-wrap:wrap}.canvas{min-height:580px}.tag{white-space:normal}.code{max-width:100%}} 
</style></head><body><div class="app"><aside class="side"><div><div class="brand"><span class="mark">F</span>FlowHub</div><div class="version" style="margin-left:45px">STUDIO / 2.0</div></div><nav class="nav" id="nav"></nav><div class="sidefoot"><span class="dot"></span>单一 MCP 入口<br><b>7 个兼容工具 + 14 个新增工具</b><p>个人优先 · 自动编排<br>无审批节点 · 业务原值</p></div></aside><main class="main"><div class="top"><span>本地工作空间 / 交互设计参考</span><span class="tag">离线原型 · 所有数据均为合成</span></div><div class="content" id="content"></div></main></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script>
'use strict';
const navItems=[['discover','Codex 发现'],['library','工作流库'],['editor','AI 编排画布'],['assistant','AI 工作台'],['testing','工作流自测'],['models','模型设置']];
let page='discover',tab='properties',selected='logs',revision=1,created=false,testsDone=false,scanDone=false,selectedEnv='production';
const imported=new Set();const history=[];
const toolRows=[['logs','A','阿里云日志 MCP','用户配置 · 2 个工具','hub_direct'],['hw','H','华为云日志 MCP','项目配置 · 2 个工具','hub_direct'],['db','D','数据库 MCP','用户配置 · 3 个工具','hub_direct'],['report','S','排障报告插件','本机已安装 · 2 个 Skills','codex_host']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const n=document.getElementById('toast');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',2400)}
function title(k,t,sub,buttons=''){return `<div class="heading"><div><div class="kicker">${k}</div><h1>${t}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function notice(){return '<div class="notice">本文件只演示界面与固定交互，不读取本机配置，不访问 MCP 或模型。刷新后状态重置；不要在这里输入真实凭据。</div>'}
function render(){document.getElementById('nav').innerHTML=navItems.map(([id,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${label}</button>`).join('');document.getElementById('content').innerHTML=views[page]();bind()}
const views={
discover:()=>title('DISCOVER YOUR CAPABILITIES','把 Codex 的能力带入工作流','发现已有 MCP、已装插件与 Skills，清楚区分来源和执行位置。','<button data-action="scan">重新扫描</button><button class="primary" data-page="editor">开始编排</button>')+notice()+`<div class="grid stats"><div class="card stat"><span class="small">MCP Servers</span><strong>3</strong><span class="tag">2 类配置来源</span></div><div class="card stat"><span class="small">已安装插件</span><strong>1</strong><span class="tag">不包含市场可用项</span></div><div class="card stat"><span class="small">可索引 Skills</span><strong>2</strong><span class="tag">宿主执行</span></div><div class="card stat"><span class="small">已导入能力源</span><strong>${imported.size}</strong><span class="tag green">模拟状态</span></div></div><div class="split"><section class="card"><div class="heading" style="margin-bottom:15px"><div><h2>本机能力清单</h2><p class="small">Windows native · 合成 Codex 上下文 · ${scanDone?'刚刚完成模拟刷新':'待模拟刷新'}</p></div></div><div class="list">${toolRows.map(([id,letter,name,desc,executor])=>`<div class="row"><div class="icon">${letter}</div><div class="body"><h3>${name}</h3><div class="small">${desc}</div><span class="tag ${executor==='codex_host'?'amber':''}">${executor==='codex_host'?'仅宿主可用':'可独立接入'}</span></div><button data-import="${id}" ${imported.has(id)?'disabled':''}>${imported.has(id)?'已导入':executor==='codex_host'?'用于 Codex 流程':'导入能力'}</button></div>`).join('')}</div></section><aside class="card"><h2>发现上下文</h2><div class="field"><label for="ctx">当前上下文</label><select id="ctx"><option>Windows · 示例项目</option><option>WSL · 独立示例上下文</option></select></div><p class="small">配置来源</p><div class="code">fixture://codex-home/config.toml\nfixture://project/.codex/config.toml\nfixture://installed-plugin/</div><div class="pillgroup"><span class="tag green">只读发现</span><span class="tag gray">不执行 hooks</span></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>为什么有“仅宿主可用”？</h3><p class="small">有些插件依赖 Codex 会话。模型 API Key 不会自动取得这些能力；正式版会保留准确的调用位置。</p></aside></div>`,
library:()=>title('REUSABLE WORKFLOWS','工作流库','配置一次，继续通过同一个 FlowHub MCP 复用。','<button class="primary" data-action="newflow">用 AI 创建</button>')+notice()+`<div class="grid two">${[['production','生产问题排查','阿里云日志 + 生产数据库'],['staging','试运行问题排查','华为云日志 + 试运行数据库']].map(([env,name,detail])=>`<section class="card workflow"><span class="tag ${env==='production'?'':'green'}">${env}</span><h2 style="margin-top:12px">${name}</h2><p>${detail} · 宿主报告 Skill</p><div class="mini"><span>日志</span>→<span>分析</span>→<span>数据库</span>→<span>报告</span></div><div class="actions"><button class="primary" data-edit="${env}">打开编排</button><button data-page="testing">查看自测</button><span class="small">示例草稿 · r${revision}</span></div></section>`).join('')}</div><p class="footnote">这两个卡片仅为原型示例，不代表你的仓库或电脑已创建对应工作流。</p>`,
editor:()=>title('COMPOSE WITH AI',selectedEnv==='production'?'生产问题排查':'试运行问题排查',`草稿 r${revision} · 固定环境 ${selectedEnv} · 与正式运行数据分离`,'<button data-action="undo">撤销演示变更</button><button data-action="validate">校验</button><button data-page="testing">自测</button><button class="primary" data-action="export">导出演示结构</button>')+`<div class="editor"><section class="canvas"><div class="canvaslabel">可视化画布 / 点击节点查看属性 · 本原型不实现自由拖拽</div><div class="nodes">${nodes().map((n,i)=>`${i?'<div class="connector"></div>':''}<button class="node ${selected===n.id?'selected':''} ${n.added?'nodeadd':''}" data-node="${n.id}"><span class="num">${String(i+1).padStart(2,'0')} / ${n.kind}</span><strong>${n.title}</strong><span class="small">${n.sub}</span></button>`).join('')}</div><div class="bottomchip">${created?'AI 已添加示例条件 · 合成变更':'原始示例链路'} · 单一 MCP Server</div></section><aside class="inspector"><div class="tabs"><button data-tab="properties" class="${tab==='properties'?'sel':''}">节点属性</button><button data-tab="chat" class="${tab==='chat'?'sel':''}">AI 助手</button></div>${tab==='properties'?properties():`<span class="tag">当前节点：${esc(selected)}</span><h2 style="margin-top:18px">直接在画布上协作</h2><p class="small">示例：“增加是否查询数据库的分支，并保存草稿。”</p><div class="tool">正式版使用原子 operations 与 revision；不会覆盖用户未保存的修改。</div><textarea id="editorPrompt" aria-label="编排需求" rows="5" placeholder="给数据库查询增加条件分支"></textarea><button class="primary" style="width:100%;margin-top:12px" data-action="compose">模拟添加分支</button><p class="footnote">演示固定操作，不会调用真实模型。</p>`}</aside></div>`,
assistant:()=>title('ASSISTANT WORKSPACE','项目答疑，也能真正编排','正式版与 Codex 共用同一个 Authoring Service。')+notice()+`<div class="split"><section class="chatbox"><div class="chathead"><b>FlowHub 助手</b> <span class="tag">Scripted 演示</span></div><div class="messages" id="messages"><div class="bubble bot"><h3>从目标开始，不必从空白画布开始。</h3><p>试试：“创建一个生产排障流程”。本原型会演示能力选择、草稿变更和画布同步。</p></div>${history.map(x=>`<div class="bubble ${x.who}">${esc(x.text)}</div>${x.tool?'<div class="tool">模拟工具回执 · workflow_draft_patch<br>草稿修订 r'+revision+' · 点击“打开编排”查看</div>':''}`).join('')}</div><div class="composer"><textarea id="chatInput" aria-label="助手消息" placeholder="创建一个生产排障流程，保存为草稿"></textarea><div class="actions"><button class="primary" data-action="chat">发送演示消息</button><button data-page="editor">打开编排</button></div></div></section><aside class="card"><h2>本次上下文</h2><div class="railstep"><b>能力目录</b><p class="small">3 个合成 MCP，2 个 Skill</p></div><div class="railstep"><b>当前工作流</b><p class="small">${selectedEnv} · 草稿 r${revision}</p></div><div class="railstep"><b>项目帮助</b><p class="small">正式版引用当前实现文档，不把计划能力当已实现。</p></div><h3>工具动作必须有回执</h3><p class="small">AI 说“完成”不等于保存。正式版展示真实 workflowId、revision 和变更节点。</p><div class="pillgroup"><span class="tag">无逐步审批</span><span class="tag">可撤销变更</span></div></aside></div>`,
models:()=>title('MODEL CONNECTIONS','模型设置','配置内置助手；不影响无 Key 的 Codex 编排路径。')+notice()+`<div class="split"><section class="card"><h2>添加模型配置</h2><div class="grid two"><div class="field"><label for="modelName">配置名称</label><input id="modelName" value="我的编排助手（演示）"></div><div class="field"><label for="protocol">API 协议</label><select id="protocol"><option>OpenAI Responses</option><option>OpenAI-compatible Chat Completions</option></select></div></div><div class="field"><label for="base">Base URL</label><input id="base" value="https://model.example.invalid/v1"></div><div class="field"><label for="model">Model</label><input id="model" placeholder="由实际 Provider 提供，原型不设真实型号"></div><div class="field"><label for="key">API Key</label><input id="key" type="password" disabled placeholder="离线原型不接收任何真实 Key"></div><div class="actions"><button class="primary" data-action="modeltest">演示能力检测</button><span class="small">不发送网络请求</span></div><div id="modelResult" style="margin-top:17px"></div></section><aside class="card"><h2>三个能力分别检测</h2><div class="railstep"><b>文本问答</b><p class="small">认证和最小文本请求</p></div><div class="railstep"><b>工具调用</b><p class="small">结构化参数与回执关联</p></div><div class="railstep"><b>流式响应</b><p class="small">完整参数后才执行动作</p></div><p class="small">提供商不支持工具时，正式版仍可保留问答，但不能假装已经完成流程修改。</p></aside></div>`,
testing:()=>title('TEST THE WORKFLOW','生成用例，让流程先跑起来','Mock 验证编排逻辑；真实接入和模型效果单独记录。','<button data-action="generate">生成演示用例</button><button class="primary" data-action="test">运行演示 Mock</button>')+notice()+`<div class="grid stats"><div class="card stat"><span class="small">草稿修订</span><strong>r${revision}</strong></div><div class="card stat"><span class="small">示例用例</span><strong>4</strong></div><div class="card stat"><span class="small">模拟通过</span><strong>${testsDone?'3':'—'}</strong></div><div class="card stat"><span class="small">未覆盖</span><strong>${testsDone?'1':'—'}</strong></div></div><section class="card"><div class="heading" style="margin-bottom:10px"><div><h2>用例与独立断言</h2><p class="small">运行级别：Mock · 不调用真实 MCP · 不访问公司数据</p></div><span class="tag ${testsDone?'green':'gray'}">${testsDone?'演示已完成':'演示未执行'}</span></div><div class="tablewrap"><table><thead><tr><th>用例</th><th>预期</th><th>结果</th><th>证据</th></tr></thead><tbody>${[['正常日志与订单','SUCCEEDED / 环境哨兵一致'],['无需查库分支','数据库节点 SKIPPED'],['缺少必填订单号','INPUT_INVALID'],['宿主报告 Skill','真实 Codex 交接']].map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="tag ${testsDone?(i===3?'amber':'green'):'gray'}">${testsDone?(i===3?'未覆盖':'模拟通过'):'未执行'}</span></td><td>${testsDone?(i===3?'需要真实宿主':'合成断言与调用记录'):'—'}</td></tr>`).join('')}</tbody></table></div><p class="footnote">正式版缺少 fixture 必须显示缺口；本页演示“3 通过 + 1 未覆盖”，不是产品测试执行结果。</p></section>`};
function nodes(){let a=[{id:'input',kind:'INPUT',title:'接收排查范围',sub:'orderNo / 时间范围'},{id:'logs',kind:'MCP TOOL',title:'查询固定环境日志',sub:selectedEnv==='production'?'阿里云 · production':'华为云 · staging'},{id:'analysis',kind:'AGENT TASK',title:'分析异常并决定是否查库',sub:'Codex 或兼容的助手执行器'}];if(created)a.push({id:'condition',kind:'CONDITION',title:'是否需要查库？',sub:'true → 数据库 / false → 报告',added:true});a.push({id:'db',kind:'MCP TOOL',title:'数据库核对',sub:'固定连接 / 原值参数'},{id:'report',kind:'HOST SKILL',title:'生成排障报告',sub:'实际 Markdown + 证据引用'});return a}
function properties(){let n=nodes().find(x=>x.id===selected)||nodes()[0];return `<h2>${n.title}</h2><p class="small">${n.kind} / ${n.id}</p><div class="field"><label>固定环境</label><div class="code">${selectedEnv}</div></div><div class="field"><label>参数来源</label><div class="code">orderNo ← input./orderNo\n环境 ← binding.environment</div></div><div class="field"><label>执行位置</label><div class="code">${n.id==='report'?'codex_host':n.id==='analysis'?'Codex / assistant_local':'hub_direct'}</div></div><div class="tool">业务值保持原样。凭据通过连接引用提供，不作为节点普通输出。</div><button class="soft" style="width:100%" data-tab="chat">让 AI 修改这个流程</button>`}
function compose(){created=true;testsDone=false;revision++;selected='condition';toast('已添加合成条件节点；正式版须由后端提交 operation');render()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selected=b.dataset.node;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{selectedEnv=b.dataset.edit;page='editor';render()});document.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>{let id=b.dataset.import;const d=document.getElementById('modal');d.innerHTML=`<h2>导入合成能力</h2><p>这一步仅演示 FlowHub 配置，不会改写 Codex。</p><div class="field"><label for="env">固定环境</label><select id="env"><option value="test">test / 测试</option value="staging">staging / 试运行</option><option value="production">production / 生产</option></select></div><div class="actions"><button id="importSave" class="primary">保存演示绑定</button><button id="close">取消</button></div>`;d.showModal();d.querySelector('#close').onclick=()=>d.close();d.querySelector('#importSave').onclick=()=>{imported.add(id);d.close();render();toast('合成能力已导入；未进行真实连接')};});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='scan'){scanDone=true;render();toast('模拟扫描完成：3 MCP、1 插件、2 Skills')}if(a==='newflow'){page='assistant';render()}if(a==='compose')compose();if(a==='validate')toast('演示校验完成；未调用正式后台');if(a==='undo'){if(created){created=false;revision++;selected='logs';testsDone=false;render();toast('演示变更已撤销')}else toast('没有可撤销的演示变更')}if(a==='chat'){let q=document.getElementById('chatInput').value.trim();if(!q)return;history.push({who:'user',text:q});if(/创建|流程|编排|分支/.test(q)){selectedEnv=q.includes('试运行')?'staging':'production';created=true;revision++;testsDone=false;history.push({who:'bot',text:'已演示生成对应环境的草稿与条件节点。正式版必须从能力目录匹配真实工具，再通过统一编排服务保存。',tool:true})}else history.push({who:'bot',text:'这是离线设计原型，只演示固定交互。正式版会检索当前项目文档并引用实际来源，不在此页面生成真实答案。'});render()}if(a==='generate')toast('已展示四个合成用例；没有生成或运行真实测试');if(a==='test'){testsDone=true;render();toast('演示结果：3 项模拟通过，1 项需真实宿主验证')}if(a==='modeltest')document.getElementById('modelResult').innerHTML='<span class="tag green">文本：模拟通过</span> <span class="tag green">工具：模拟通过</span> <span class="tag green">流式：模拟通过</span><p class="small">未访问任何网络或保存任何 Key。</p>';if(a==='export'){const result={designPrototype:true,synthetic:true,environment:selectedEnv,revision,nodes:nodes(),note:'仅为界面结构示例，不是可直接导入当前产品的执行DSL'};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));let link=document.createElement('a');link.href=url;link.download='flowhub-v2-ui-demo.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}})}
render();
</script></body></html>
